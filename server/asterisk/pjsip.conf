; external_*_address: Asterisk runs inside the Docker container and would
; otherwise advertise its own container-internal IP in SDP/ICE candidates,
; which the browser (running on the host, outside the container) can't reach.
; Forcing 127.0.0.1 works because both the container's published ports and
; the browser are on the same machine for this local-dev setup.
[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0
external_media_address = 127.0.0.1
external_signaling_address = 127.0.0.1

; Shared by every test endpoint. webrtc=yes turns on ICE/rtcp-mux/AVPF;
; dtls_auto_generate_cert lets Asterisk self-sign its own DTLS-SRTP media
; cert so calls are still media-encrypted even without a real certificate.
[endpoint-template](!)
type = endpoint
context = students
disallow = all
allow = opus
allow = ulaw
webrtc = yes
media_encryption = dtls
dtls_auto_generate_cert = yes
ice_support = yes
rtcp_mux = yes
use_avpf = yes
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

; ---- 1001 ----
[1001](endpoint-template)
auth = 1001-auth
aors = 1001

[1001-auth]
type = auth
auth_type = userpass
username = 1001
password = 1001pass

[1001]
type = aor
max_contacts = 1

; ---- 1002 ----
[1002](endpoint-template)
auth = 1002-auth
aors = 1002

[1002-auth]
type = auth
auth_type = userpass
username = 1002
password = 1002pass

[1002]
type = aor
max_contacts = 1
