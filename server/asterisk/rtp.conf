[general]
; Small range on purpose: large UDP ranges are slow/flaky to publish via
; Docker Desktop on Windows (one docker-proxy process per port). 21 ports
; is far more than two hardcoded test endpoints need.
rtpstart=10000
rtpend=10020
icesupport=yes

; Asterisk builds its ICE host candidates from the container's own interfaces
; (172.x), which nothing outside Docker can reach. Map it to the host's LAN IP
; so phones on the WiFi get a reachable audio candidate. BOTH addresses can
; drift: the left one if Docker recreates the network, the right one with DHCP.
; Check with: docker inspect legonline-asterisk --format
; "{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}"   and ipconfig.
[ice_host_candidates]
172.18.0.2 => 10.140.37.171
