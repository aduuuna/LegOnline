[students]
; If the callee's app is registered (foreground or background-alive), dial
; straight away. If not — app killed/asleep — hit the push-gateway to wake the
; phone, then poll up to ~12s for the endpoint to register before dialing.
; DEVICE_STATE is UNAVAILABLE when the AOR has no live contacts.
exten => _X.,1,NoOp(Call to ${EXTEN} from ${CALLERID(num)})
 same => n,GotoIf($["${DEVICE_STATE(PJSIP/${EXTEN})}" != "UNAVAILABLE"]?dial)
 same => n,NoOp(${EXTEN} is offline - asking push-gateway to wake it)
 same => n,Set(PUSHRESULT=${CURL(http://push-gateway:3000/notify,ext=${EXTEN}&from=${CALLERID(num)})})
 same => n,NoOp(push-gateway said: ${PUSHRESULT})
 same => n,Set(WAITED=0)
 same => n(waitloop),Wait(1)
 same => n,Set(WAITED=$[${WAITED}+1])
 same => n,GotoIf($["${DEVICE_STATE(PJSIP/${EXTEN})}" != "UNAVAILABLE"]?dial)
 same => n,GotoIf($[${WAITED} < 12]?waitloop)
 same => n,NoOp(${EXTEN} never came online - giving up)
 same => n(dial),Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
